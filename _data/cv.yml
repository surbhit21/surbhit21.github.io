  summary: Computational neuroscientist and research scientist with a PhD in Neuroscience, working at the intersection of recurrent and oscillatory neural dynamics, synaptic and intrinsic plasticity, memory, and machine learning. Experienced in developing mathematically grounded models of neural and molecular dynamics and translating them into scalable Python and PyTorch simulations.

  social_networks:
