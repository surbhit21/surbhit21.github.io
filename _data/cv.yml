    Projects:
      - name: Recurrent Network Models of Systems Consolidation and Representational Drift
        start_date: 2025-06
        end_date: present
        summary: Manuscript submitted
        highlights:
          - Developed a multi-region recurrent rate-based neural network of hippocampal and cortical populations to investigate memory consolidation and representational drift.
          - Modelled Hebbian plasticity, recurrent and feed-forward connectivity, intrinsic excitability, and activity-dependent intrinsic plasticity.
          - Designed in-silico perturbations and analysed ensemble recruitment, connectivity, population activity, and population-vector correlations.
          - Demonstrated how transient intrinsic plasticity can stabilise cortical memories despite ongoing hippocampal representational drift.

      - name: Computational Modelling of Learning-Evoked Oscillatory Dynamics
        start_date: 2026
        end_date: present
        summary: Developing a model of how learning-evoked slow oscillations may organise population activity and offline memory reactivation in the human medial temporal lobe.

