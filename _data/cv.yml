  sections:
    Experience:
      - company: Imperial College London
        position: Postdoctoral Research Associate
        location: London, UK
        start_date: 2025-06
        end_date: present
        highlights:
          - Design and implement modular computational and machine-learning research frameworks in Python and PyTorch for data-intensive biological and medical research.
          - Develop reusable scientific-computing infrastructure supporting numerical modelling, machine learning, large-scale analysis, and reproducible workflows across neuroscience and breast-cancer projects.
          - Translate mathematically grounded models into scalable implementations with automated testing, documentation, and CI/CD.
          - Collaborate with computational scientists, experimental researchers, and engineers to turn scientific questions into robust models and software systems.

      - company: University Hospital Bonn
        position: PhD Researcher
        location: Bonn, Germany
        start_date: 2023-09
        end_date: 2025-05
        highlights:
          - Designed PyTorch pipelines using U-Net and Fast R-CNN architectures for biological feature detection, segmentation, and quantitative microscopy analysis.
          - Developed Python image-analysis methods for tracing neuronal processes, detecting fluorescent puncta, and characterising neuronal morphology.
          - Built reusable packages and end-to-end workflows integrating data ingestion, numerical methods, simulation, image processing, optimisation, and automated evaluation.

      - company: University of Mainz Medical Center
        position: PhD Researcher
        location: Mainz, Germany
        start_date: 2020-07
        end_date: 2023-08
        highlights:
          - Developed quantitative models of molecular transport, receptor trafficking, and synaptic processes using differential equations, numerical simulation, optimisation, and data-driven modelling.
          - Connected mathematical models with experimental measurements to investigate neuronal signalling and synaptic plasticity.
          - Maintained reproducible computational workflows and documentation for interdisciplinary research teams.

      - company: National Centre for Biological Sciences / Institute for Stem Cell Science and Regenerative Medicine
        position: Junior Research Assistant
        location: India
        start_date: 2018-11
        end_date: 2020-05
        highlights:
          - Developed distributed Python pipelines for large-scale parameter optimisation on HPC infrastructure.
          - Optimised biochemical reaction-network models containing hundreds of reactions and thousands of parameters.
          - Built REST APIs, data-processing infrastructure, and scientific web applications for biological datasets.

